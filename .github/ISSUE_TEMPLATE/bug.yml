name: Fallo
description: Algo no funciona como debería.
labels: [bug]
body:
  - type: textarea
    id: que
    attributes:
      label: Qué pasa
      description: Qué hiciste, qué esperabas y qué pasó.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Abre Moss
        2. Ve a Encargos
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión de Moss
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: sistema
    attributes:
      label: Sistema
      placeholder: "macOS 26.1, Apple Silicon"
  - type: dropdown
    id: agente
    attributes:
      label: Agente
      options: [Claude Code, Codex, Cursor, OpenCode, Gemini CLI, Comando propio, No aplica]
  - type: textarea
    id: registro
    attributes:
      label: Registro o capturas
      description: Sin tokens, claves ni contenido privado de tu cerebro.
      render: text
