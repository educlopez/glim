name: Propuesta
description: Una idea o mejora para Glim.
labels: [enhancement]
body:
  - type: textarea
    id: problema
    attributes:
      label: Qué problema resuelve
      description: Qué intentas hacer y qué te lo impide hoy.
    validations:
      required: true
  - type: textarea
    id: propuesta
    attributes:
      label: Propuesta
      description: Cómo te imaginas que funcione.
    validations:
      required: true
  - type: textarea
    id: alternativas
    attributes:
      label: Alternativas
      description: Otras formas que hayas probado o pensado.
