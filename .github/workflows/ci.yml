# Comprobaciones de cada PR y de main: lint, tests, build, esquema y secretos (Mac y Linux), y la prueba de humo e2e.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  check:
    name: Lint, tests y build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Esquema al día
        run: |
          npm run esquema
          git diff --exit-code schema/ && test -z "$(git status --porcelain schema/)" || { echo "::error::schema/glim.config.schema.json no está al día: ejecuta npm run esquema y súbelo"; exit 1; }
      - name: Python
        run: python3 -m py_compile server/*.py
      - name: Secretos
        shell: bash
        run: |
          patron='(^|[^A-Za-z0-9])(gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{40,}|sk-(ant-)?[A-Za-z0-9_-]{24,}|AKIA[0-9A-Z]{16})|-----BEGIN [A-Z ]*PRIVATE KEY-----'
          if git grep -nIE "$patron" -- ':!package-lock.json'; then
            echo "::error::Posible secreto en los archivos del repo"
            exit 1
          fi

  e2e:
    name: Prueba de humo (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
